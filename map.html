<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Карта праздника</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#1e3320; }

    #scene {
      position: absolute; inset: 0;
      overflow: hidden;
      touch-action: none;
    }

    /* Слой с картинкой — двигается и масштабируется */
    #layer {
      position: absolute;
      transform-origin: 0 0;
      will-change: transform;
    }

    #map-img {
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Точка геолокации — вне слоя, фиксированный размер */
    #dot {
      position: absolute;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #4285f4;
      border: 3px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      transform: translate(-50%, -50%);
      display: none;
      pointer-events: none;
      z-index: 20;
    }
    #dot::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: rgba(66,133,244,0.25);
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(0.5); opacity:1; }
      100% { transform: scale(2);   opacity:0; }
    }

    #ring {
      position: absolute;
      border-radius: 50%;
      background: rgba(66,133,244,0.1);
      border: 1.5px solid rgba(66,133,244,0.35);
      transform: translate(-50%, -50%);
      display: none;
      pointer-events: none;
      z-index: 19;
    }

    /* Кнопки */
    #btn-me {
      position: fixed; bottom: 28px; right: 16px;
      width: 50px; height: 50px; border-radius: 50%;
      background: white; border: none;
      box-shadow: 0 3px 12px rgba(0,0,0,0.4);
      font-size: 22px; cursor: pointer; z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    #btn-me:active { transform: scale(0.9); }

    #btn-fit {
      position: fixed; bottom: 90px; right: 18px;
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255,255,255,0.92); border: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-size: 18px; cursor: pointer; z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }

    #status {
      position: fixed; bottom: 152px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65); color: white;
      padding: 6px 16px; border-radius: 18px;
      font-size: 13px; font-family: -apple-system, sans-serif;
      z-index: 100; white-space: nowrap;
      transition: opacity 0.4s;
    }
    #status.hidden { opacity:0; pointer-events:none; }
  </style>
</head>
<body>

<div id="scene">
  <div id="layer">
    <img id="map-img" src="map.png?v=2" draggable="false">
  </div>
  <div id="ring"></div>
  <div id="dot"></div>
</div>

<div id="status">📍 Определяем местоположение…</div>
<button id="btn-fit"  onclick="fitView()"     title="Вся карта">⊙</button>
<button id="btn-me"   onclick="centerOnMe()"  title="Где я">📍</button>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ── Константы ──────────────────────────────────────────────────────
const IMG_W = 941, IMG_H = 1672;

// GPS-калибровка (две точки + подтверждено Коло)
// Бунгало (649,117) → (54.072371, 27.788253)
// Скворечники (198,1488) → (54.070868, 27.783794)
// Коло (407,822) → (54.071613, 27.785933) — погрешность 0.1 м ✓
const A_PX  = [198, 1488];
const A_GPS = [54.070868, 27.783794];
const THETA = 41.92 * Math.PI / 180;
const CT = Math.cos(THETA), ST = Math.sin(THETA);
const S   = 0.23274; // м/пиксель
const M_LAT = 111320;
const M_LNG = 111320 * Math.cos(A_GPS[0] * Math.PI / 180);

// GPS → пиксель изображения
function gpsToImg(lat, lng) {
  const E = (lng - A_GPS[1]) * M_LNG;
  const N = (lat - A_GPS[0]) * M_LAT;
  return [
    A_PX[0] + ( CT*E - ST*N) / S,
    A_PX[1] + (-ST*E -  CT*N) / S,
  ];
}

// ── Трансформация вида ─────────────────────────────────────────────
let tx = 0, ty = 0, sc = 1;
const layer  = document.getElementById('layer');
const mapImg = document.getElementById('map-img');
mapImg.style.width  = IMG_W + 'px';
mapImg.style.height = IMG_H + 'px';

function applyTx() {
  layer.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
}

function fitView() {
  const sw = window.innerWidth, sh = window.innerHeight;
  sc = Math.min(sw / IMG_W, sh / IMG_H);
  tx = (sw - IMG_W * sc) / 2;
  ty = (sh - IMG_H * sc) / 2;
  applyTx();
  redrawDot();
}

fitView();
window.addEventListener('resize', fitView);

// Пиксель изображения → экранные координаты
function imgToScreen(ix, iy) {
  return [ix * sc + tx, iy * sc + ty];
}

// ── Точка геолокации ───────────────────────────────────────────────
const dot  = document.getElementById('dot');
const ring = document.getElementById('ring');
let lastLat = null, lastLng = null, lastAcc = 0;

function redrawDot() {
  if (lastLat === null) return;
  const [ix, iy] = gpsToImg(lastLat, lastLng);
  const [sx, sy] = imgToScreen(ix, iy);
  dot.style.left = sx + 'px';
  dot.style.top  = sy + 'px';
  dot.style.display = 'block';
  const r = (lastAcc / S) * sc;
  ring.style.left   = sx + 'px';
  ring.style.top    = sy + 'px';
  ring.style.width  = r * 2 + 'px';
  ring.style.height = r * 2 + 'px';
  ring.style.display = r > 5 ? 'block' : 'none';
}

function centerOnMe() {
  if (lastLat === null) { showStatus('⏳ Геолокация ещё не готова…', true); return; }
  const [ix, iy] = gpsToImg(lastLat, lastLng);
  const sw = window.innerWidth, sh = window.innerHeight;
  tx = sw / 2 - ix * sc;
  ty = sh / 2 - iy * sc;
  applyTx();
  redrawDot();
  showStatus('📍 Вы здесь', true);
}

// ── Пинч-зум и перетаскивание ──────────────────────────────────────
const scene = document.getElementById('scene');
let pointers = {}, lastPinchDist = 0;

scene.addEventListener('pointerdown', e => {
  pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
  scene.setPointerCapture(e.pointerId);
});

scene.addEventListener('pointermove', e => {
  if (!pointers[e.pointerId]) return;
  const prev = pointers[e.pointerId];
  const ids = Object.keys(pointers);

  if (ids.length === 1) {
    // Перетаскивание
    tx += e.clientX - prev.x;
    ty += e.clientY - prev.y;
    applyTx();
    redrawDot();

  } else if (ids.length === 2) {
    // Пинч-зум
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    const [id1, id2] = ids;
    const p1 = pointers[id1], p2 = pointers[id2];
    const dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    if (lastPinchDist > 0) {
      const ratio = dist / lastPinchDist;
      const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
      const newSc = Math.max(0.3, Math.min(10, sc * ratio));
      tx = mx - (mx - tx) * newSc / sc;
      ty = my - (my - ty) * newSc / sc;
      sc = newSc;
      applyTx();
      redrawDot();
    }
    lastPinchDist = dist;
    return;
  }

  pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
});

scene.addEventListener('pointerup',    e => { delete pointers[e.pointerId]; lastPinchDist = 0; });
scene.addEventListener('pointercancel',e => { delete pointers[e.pointerId]; lastPinchDist = 0; });

// ── Статус-строка ──────────────────────────────────────────────────
const statusEl = document.getElementById('status');
let hideTimer;
function showStatus(text, autohide) {
  statusEl.textContent = text;
  statusEl.classList.remove('hidden');
  clearTimeout(hideTimer);
  if (autohide) hideTimer = setTimeout(() => statusEl.classList.add('hidden'), 3000);
}

// ── Геолокация ─────────────────────────────────────────────────────
if (navigator.geolocation) {
  navigator.geolocation.watchPosition(
    pos => {
      lastLat = pos.coords.latitude;
      lastLng = pos.coords.longitude;
      lastAcc = Math.round(pos.coords.accuracy);
      redrawDot();
      showStatus('📍 Точность: ±' + lastAcc + ' м', true);
    },
    err => {
      const m = {1:'🔒 Нет доступа к геолокации', 2:'⚠️ Геолокация недоступна', 3:'⏱ Таймаут'};
      showStatus(m[err.code] || '⚠️ Ошибка геолокации', false);
    },
    { enableHighAccuracy: true, maximumAge: 3000, timeout: 10000 }
  );
} else {
  showStatus('⚠️ Геолокация не поддерживается', false);
}
</script>
</body>
</html>
