<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Карта праздника</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#1e3320; }

    #scene {
      position: absolute; inset: 0;
      overflow: auto;                      /* панорама = нативный скролл */
      display: flex;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-x pan-y;
    }

    /* Слой с картинкой — его размер меняется при зуме, скролл его возит */
    #layer {
      position: relative;
      margin: auto;                        /* центрирует и сохраняет скролл */
      flex: none;
      will-change: width, height;
    }

    #map-img {
      display: block;
      width: 100%; height: 100%;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Точка геолокации — вне слоя, фиксированный размер */
    #dot {
      position: absolute;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #4285f4;
      border: 3px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      transform: translate(-50%, -50%);
      display: none;
      pointer-events: none;
      z-index: 20;
    }
    #dot::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: rgba(66,133,244,0.25);
      animation: pulse 2s ease-out infinite;
    }
    @keyframes pulse {
      0%   { transform: scale(0.5); opacity:1; }
      100% { transform: scale(2);   opacity:0; }
    }

    #ring {
      position: absolute;
      border-radius: 50%;
      background: rgba(66,133,244,0.1);
      border: 1.5px solid rgba(66,133,244,0.35);
      transform: translate(-50%, -50%);
      display: none;
      pointer-events: none;
      z-index: 19;
    }

    /* Кнопки */
    #btn-me {
      position: fixed; bottom: 28px; right: 16px;
      width: 50px; height: 50px; border-radius: 50%;
      background: white; border: none;
      box-shadow: 0 3px 12px rgba(0,0,0,0.4);
      font-size: 22px; cursor: pointer; z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }
    #btn-me:active { transform: scale(0.9); }

    #btn-fit {
      position: fixed; bottom: 90px; right: 18px;
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255,255,255,0.92); border: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-size: 18px; cursor: pointer; z-index: 100;
      display: flex; align-items: center; justify-content: center;
    }

    #btn-zoom-in, #btn-zoom-out {
      position: fixed; right: 18px;
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(255,255,255,0.92); border: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      font-size: 26px; line-height: 1; cursor: pointer; z-index: 100;
      color: #1e3320; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    #btn-zoom-out { bottom: 144px; }
    #btn-zoom-in  { bottom: 196px; }
    #btn-zoom-in:active, #btn-zoom-out:active { transform: scale(0.9); }

    #status {
      position: fixed; bottom: 152px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65); color: white;
      padding: 6px 16px; border-radius: 18px;
      font-size: 13px; font-family: -apple-system, sans-serif;
      z-index: 100; white-space: nowrap;
      transition: opacity 0.4s;
    }
    #status.hidden { opacity:0; pointer-events:none; }

    /* Всплывающая карточка локации */
    #loc-sheet {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #1e3320;
      border-radius: 20px 20px 0 0;
      padding: 6px 18px 36px;
      z-index: 200;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 -4px 24px rgba(0,0,0,0.5);
      font-family: -apple-system, sans-serif;
    }
    #loc-sheet.open { transform: translateY(0); }
    #loc-sheet-handle {
      width: 40px; height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      margin: 0 auto 14px;
    }
    #loc-sheet-overlay {
      display: none; position: fixed; inset: 0; z-index: 199;
      background: rgba(0,0,0,0.45);
    }
    #loc-sheet-overlay.open { display: block; }

    #loc-sheet-title {
      color: #e8c870;
      font-size: 16px; font-weight: 700;
      text-align: center;
      margin-bottom: 16px;
    }
    .loc-event-block {
      background: rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .loc-event-label {
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.6px; text-transform: uppercase;
      margin-bottom: 5px;
    }
    .loc-event-label.now  { color: #ff7a6a; }
    .loc-event-label.next { color: #a0b89a; }
    .loc-event-time {
      font-size: 12px; color: #a0b89a; margin-bottom: 2px;
    }
    .loc-event-title {
      font-size: 15px; font-weight: 600; color: #fdf6ec;
      line-height: 1.35;
    }
    .loc-event-master {
      font-size: 12px; color: #c8922a; margin-top: 3px;
    }
    .loc-no-events {
      text-align: center; color: #a0b89a;
      font-size: 14px; padding: 10px 0 4px;
    }
    #loc-sheet-link {
      display: block; margin-top: 14px;
      background: rgba(200,146,42,0.18);
      border: 1.5px solid rgba(200,146,42,0.5);
      border-radius: 12px;
      color: #e8c870;
      font-size: 14px; font-weight: 600;
      text-align: center;
      padding: 11px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #loc-sheet-link:active { background: rgba(200,146,42,0.3); }

    /* Метки локаций */
    .loc-marker {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      z-index: 10;
    }
    .loc-pin {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: transparent;
      border: 2px solid rgba(255,255,255,0.25);
      box-sizing: border-box;
      font-size: 0;
    }
    .loc-pin span { display: none; }
    .loc-label { display: none; }
    /* Пульс при долгом нажатии */
    .loc-marker.pressing .loc-pin {
      animation: loc-pulse 0.5s ease-out forwards;
    }
    @keyframes loc-pulse {
      0%   { border-color: rgba(255,255,255,0.25); transform: scale(1); }
      50%  { border-color: rgba(255,255,255,0.7);  transform: scale(1.3); }
      100% { border-color: rgba(255,255,255,0.25); transform: scale(1); }
    }
  </style>
</head>
<body>

<div id="scene">
  <div id="layer">
    <img id="map-img" src="map.png?v=4" draggable="false">
    <div id="ring"></div>
    <div id="dot"></div>
  </div>
</div>

<div id="loc-sheet-overlay" onclick="closeLocSheet()"></div>
<div id="loc-sheet">
  <div id="loc-sheet-handle"></div>
  <div id="loc-sheet-title"></div>
  <div id="loc-sheet-body"></div>
  <div id="loc-sheet-link" onclick="openFullSchedule()">📅 Полное расписание</div>
</div>

<div id="status" class="hidden">📍 Определяем местоположение…</div>
<button id="btn-zoom-in"  onclick="zoomBy(1.5)"    title="Приблизить">+</button>
<button id="btn-zoom-out" onclick="zoomBy(1/1.5)"  title="Отдалить">−</button>
<button id="btn-fit"  onclick="fitView()"     title="Вся карта">⊙</button>
<button id="btn-me"   onclick="centerOnMe()"  title="Где я">📍</button>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  // Чтобы вертикальные жесты двигали карту, а не сворачивали мини-аппу
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
}

// ── Константы ──────────────────────────────────────────────────────
const IMG_W = 941, IMG_H = 1672;

// GPS-калибровка (проверена по 3 точкам, погрешность < 1 м):
// Скворечники (199,1489) → 54.070868, 27.783794  [reference]
// Коло        (407, 823) → 54.071613, 27.785933  ✓
// Бунгало     (650, 118) → 54.072371, 27.788253  ✓
const A_PX  = [198.7, 1488.6];
const A_GPS = [54.070868, 27.783794];
const THETA = 41.92 * Math.PI / 180;
const CT = Math.cos(THETA), ST = Math.sin(THETA);
const S   = 0.23279; // м/пиксель
const M_LAT = 111320;
const M_LNG = 111320 * Math.cos(A_GPS[0] * Math.PI / 180);

// GPS → пиксель изображения
function gpsToImg(lat, lng) {
  const E = (lng - A_GPS[1]) * M_LNG;
  const N = (lat - A_GPS[0]) * M_LAT;
  return [
    A_PX[0] + ( CT*E - ST*N) / S,
    A_PX[1] + (-ST*E -  CT*N) / S,
  ];
}

// ── Вид: масштаб слоя + нативный скролл ────────────────────────────
let sc = 1;
const scene  = document.getElementById('scene');
const layer  = document.getElementById('layer');
const mapImg = document.getElementById('map-img');

function resizeLayer() {
  layer.style.width  = (IMG_W * sc) + 'px';
  layer.style.height = (IMG_H * sc) + 'px';
}

function fitView() {
  const sw = window.innerWidth, sh = window.innerHeight;
  sc = Math.min(sw / IMG_W, sh / IMG_H);
  resizeLayer();
  scene.scrollLeft = 0; scene.scrollTop = 0;   // вернуть к общему виду (по центру)
  redrawDot();
}

window.addEventListener('resize', fitView);

// Зум вокруг точки экрана (cx,cy) — для кнопок +/−, колёсика и двойного тапа.
// Меняем размер слоя и подкручиваем скролл, чтобы точка под пальцем осталась на месте.
function zoomBy(factor, cx, cy) {
  if (cx == null) cx = window.innerWidth / 2;
  if (cy == null) cy = window.innerHeight / 2;
  const rect = mapImg.getBoundingClientRect();
  const ix = (cx - rect.left) / sc;   // пиксель изображения под точкой
  const iy = (cy - rect.top)  / sc;
  sc = Math.max(0.3, Math.min(10, sc * factor));
  resizeLayer();
  const r2 = mapImg.getBoundingClientRect();
  scene.scrollLeft += (r2.left + ix * sc) - cx;
  scene.scrollTop  += (r2.top  + iy * sc) - cy;
  redrawDot();
}

// ── Точка геолокации ───────────────────────────────────────────────
const dot  = document.getElementById('dot');
const ring = document.getElementById('ring');
let lastLat = null, lastLng = null, lastAcc = 0;

function redrawDot() {
  if (lastLat === null) return;
  const [ix, iy] = gpsToImg(lastLat, lastLng);
  const lx = ix * sc, ly = iy * sc;       // координаты внутри слоя
  dot.style.left = lx + 'px';
  dot.style.top  = ly + 'px';
  dot.style.display = 'block';
  const r = (lastAcc / S) * sc;
  ring.style.left   = lx + 'px';
  ring.style.top    = ly + 'px';
  ring.style.width  = r * 2 + 'px';
  ring.style.height = r * 2 + 'px';
  ring.style.display = r > 5 ? 'block' : 'none';
}

function centerOnMe() {
  if (lastLat === null) {
    // Нет координат — пробуем получить принудительно
    if (useLM && lmReady) {
      showStatus('📍 Запрашиваем геолокацию…', false);
      lm.getLocation(loc => {
        if (loc) {
          onPosition(loc.latitude, loc.longitude, loc.horizontal_accuracy);
          centerOnMe();
        } else {
          // Открываем настройки Telegram для выдачи разрешения
          showStatus('🔒 Разрешите геолокацию в настройках Telegram', false);
          try { if (lm.openSettings) lm.openSettings(); } catch (e) {}
          // И пробуем браузерный запрос параллельно
          startBrowserGeo();
        }
      });
    } else {
      // Только браузерная геолокация
      showStatus('📍 Запрашиваем геолокацию…', false);
      startBrowserGeo();
      // Если разрешение уже отклонено — попробовать openSettings через 1 с
      setTimeout(() => {
        if (lastLat === null && useLM && lm && lm.openSettings) {
          try { lm.openSettings(); } catch (e) {}
        }
      }, 1000);
    }
    return;
  }
  const [ix, iy] = gpsToImg(lastLat, lastLng);
  // Если точка далеко за пределами карты — вы не на площадке: не уезжаем в пустоту
  const M = 150;
  if (ix < -M || iy < -M || ix > IMG_W + M || iy > IMG_H + M) {
    fitView();
    showStatus('📍 Вы сейчас вне площадки фестиваля', true);
    return;
  }
  const rect = mapImg.getBoundingClientRect();
  scene.scrollLeft += (rect.left + ix * sc) - window.innerWidth  / 2;
  scene.scrollTop  += (rect.top  + iy * sc) - window.innerHeight / 2;
  redrawDot();
  showStatus('📍 Вы здесь', true);
}

// ── Жесты ──────────────────────────────────────────────────────────
// Панорама = нативный скролл контейнера #scene (его Telegram НЕ перехватывает,
// в отличие от JS-жестов pointer/touch). Здесь только зум: двойной тап,
// колесо и перетаскивание мышью на десктопе.
let tapT = 0, tapX = 0, tapY = 0;          // двойной тап
let dnX = 0, dnY = 0, dnMoved = false;     // было ли движение пальца (= скролл, не тап)
let pinching = false, pinchDist = 0;       // щипок двумя пальцами (зум)

function touchDist(t) {
  return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
}
function touchMid(t) {
  return [(t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2];
}

scene.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    pinching = true; pinchDist = touchDist(e.touches); dnMoved = true;
  } else if (e.touches.length === 1) {
    dnX = e.touches[0].clientX; dnY = e.touches[0].clientY; dnMoved = false;
  }
}, { passive: true });

scene.addEventListener('touchmove', e => {
  // Щипок двумя пальцами → зум вокруг точки между пальцами
  if (e.touches.length === 2) {
    e.preventDefault();                      // отключаем нативный скролл на время щипка
    pinching = true;
    const d = touchDist(e.touches);
    const [mx, my] = touchMid(e.touches);
    if (pinchDist > 0 && d > 0) zoomBy(d / pinchDist, mx, my);
    pinchDist = d;
    return;
  }
  if (e.touches.length !== 1 ||
      Math.abs(e.touches[0].clientX - dnX) > 12 ||
      Math.abs(e.touches[0].clientY - dnY) > 12) dnMoved = true;
}, { passive: false });                      // 1 палец не блокируем → нативный скролл работает

scene.addEventListener('touchend', e => {
  if (e.touches.length < 2) { pinching = false; pinchDist = 0; }
  if (dnMoved || e.touches.length > 0 || e.changedTouches.length !== 1) return;
  const t = e.changedTouches[0], now = Date.now();
  if (now - tapT < 300 && Math.abs(t.clientX - tapX) < 30 && Math.abs(t.clientY - tapY) < 30) {
    zoomBy(1.6, t.clientX, t.clientY);       // двойной тап → приблизить
    tapT = 0;
  } else {
    tapT = now; tapX = t.clientX; tapY = t.clientY;
  }
}, { passive: true });

// Десктоп: перетаскивание мышью = скролл
let mDown = false, mX = 0, mY = 0;
scene.addEventListener('mousedown', e => { mDown = true; mX = e.clientX; mY = e.clientY; });
window.addEventListener('mousemove', e => {
  if (!mDown) return;
  scene.scrollLeft -= e.clientX - mX;
  scene.scrollTop  -= e.clientY - mY;
  mX = e.clientX; mY = e.clientY;
});
window.addEventListener('mouseup', () => { mDown = false; });
scene.addEventListener('dblclick', e => zoomBy(1.6, e.clientX, e.clientY));
scene.addEventListener('wheel', e => {
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY);
}, { passive: false });

// ── Статус-строка ──────────────────────────────────────────────────
const statusEl = document.getElementById('status');
let hideTimer;
function showStatus(text, autohide) {
  statusEl.textContent = text;
  statusEl.classList.remove('hidden');
  clearTimeout(hideTimer);
  if (autohide) hideTimer = setTimeout(() => statusEl.classList.add('hidden'), 3000);
}

// ── Геолокация ─────────────────────────────────────────────────────
const lm = tg && tg.LocationManager;
let useLM = false, lmReady = false, accessDenied = false;
let geoStarted = false;  // браузерный watchPosition запущен

function onPosition(lat, lng, acc) {
  lastLat = lat; lastLng = lng;
  lastAcc = Math.round(acc || 0);
  accessDenied = false;
  redrawDot();
  showStatus('📍 Точность: ±' + lastAcc + ' м', true);
}

// — Браузерная геолокация (фолбэк и параллельный запрос) —
function startBrowserGeo() {
  if (geoStarted || !navigator.geolocation) return;
  geoStarted = true;
  navigator.geolocation.watchPosition(
    pos => onPosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy),
    err => {
      if (lastLat !== null) return;  // уже есть координаты от LM — не перебиваем
      const m = {
        1: '🔒 Нет доступа к геолокации. Разрешите в настройках Telegram или телефона',
        2: '⚠️ Геолокация недоступна на этом устройстве',
        3: '⏱ Таймаут геолокации — нажмите 📍 ещё раз'
      };
      showStatus(m[err.code] || '⚠️ Ошибка геолокации', false);
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
  );
}

// — Telegram LocationManager: опрос каждые 4 с —
function lmPoll() {
  if (!lmReady) return;
  lm.getLocation(loc => {
    if (loc) {
      onPosition(loc.latitude, loc.longitude, loc.horizontal_accuracy);
    } else if (!accessDenied) {
      accessDenied = true;
      showStatus('🔒 Нет доступа к геолокации — нажмите 📍', false);
      // Параллельно пробуем браузерный fallback (работает на части устройств)
      startBrowserGeo();
    }
    setTimeout(lmPoll, 4000);
  });
}

// — Инициализация —
showStatus('📍 Определяем местоположение…', false);

if (lm) {
  lm.init(() => {
    if (lm.isLocationAvailable) {
      useLM = true; lmReady = true;
      lmPoll();
    } else {
      // LocationManager недоступен — пробуем браузер
      startBrowserGeo();
    }
  });
  // Если lm.init не вызвал callback за 3 с — пробуем браузер параллельно
  setTimeout(() => { if (!lmReady && !geoStarted) startBrowserGeo(); }, 3000);
} else {
  // Старый Telegram или внешний браузер
  startBrowserGeo();
}

// ── Локации на карте ──────────────────────────────────────────────
// px: [x, y] — пиксели на исходном изображении 941×1672
// Чтобы передвинуть метку — измените числа в px
const MAP_LOCS = [
  { id: 'kolo',      name: 'Коло',              emoji: '🎭', color: '#5ab0d1', px: [430, 900]  },
  { id: 'steklo',    name: 'Солнечный шатёр',   emoji: '⛺', color: '#a8b4ff', px: [300, 1360] },
  { id: 'besedka',   name: 'Лунная беседка',    emoji: '🌙', color: '#c2a36b', px: [95, 1115]  },
  { id: 'izba',      name: 'Творческая',         emoji: '🎨', color: '#ff7a6a', px: [95, 755]   },
  { id: 'veranda',   name: 'Тайная веранда',     emoji: '🌿', color: '#8bc48a', px: [200, 755]  },
  { id: 'detskaya',  name: 'Детская',            emoji: '👧', color: '#f9c74f', px: [440, 660]  },
  { id: 'stolovaya', name: 'Столовая',           emoji: '🍽', color: '#e07b54', px: [730, 260]  },
  { id: 'banya',     name: 'Баня',              emoji: '♨️', color: '#e8584a', px: [155, 415]  },
];

MAP_LOCS.forEach(loc => {
  const el = document.createElement('div');
  el.className = 'loc-marker';
  el.innerHTML = `<div class="loc-pin"></div>`;
  el.style.left = (loc.px[0] / IMG_W * 100) + '%';
  el.style.top  = (loc.px[1] / IMG_H * 100) + '%';

  let moved = false, startX = 0, startY = 0;

  el.addEventListener('touchstart', e => {
    moved = false;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  el.addEventListener('touchmove', e => {
    const dx = Math.abs(e.touches[0].clientX - startX);
    const dy = Math.abs(e.touches[0].clientY - startY);
    if (dx > 8 || dy > 8) moved = true;
  }, { passive: true });

  el.addEventListener('touchend', () => {
    if (!moved) openLocSheet(loc);
  }, { passive: true });

  el.addEventListener('click', () => openLocSheet(loc));

  layer.appendChild(el);
});

// ── Расписание ──────────────────────────────────────────────────
const API_URL = 'https://solnechny-krug-bot-production.up.railway.app/api/schedule';
// Даты фестиваля → индекс дня
const FEST_DAYS = { '2026-07-02': 0, '2026-07-03': 1, '2026-07-04': 2, '2026-07-05': 3 };
const DAY_LABELS = ['2 июля', '3 июля', '4 июля', '5 июля'];
const FULL_SCHEDULE_LOCS = ['banya', 'stolovaya'];

let _scheduleCache = null;
let _currentLocId  = null;

async function loadSchedule() {
  if (_scheduleCache) return _scheduleCache;
  try {
    const r = await fetch(API_URL);
    const d = await r.json();
    _scheduleCache = d.events || [];
  } catch {
    _scheduleCache = [];
  }
  return _scheduleCache;
}

function getCurrentDayIdx() {
  const now = new Date();
  const key = now.toISOString().slice(0, 10);
  return FEST_DAYS[key] ?? -1;
}

function timeToMin(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function openLocSheet(loc) {
  _currentLocId = loc.id;
  document.getElementById('loc-sheet-title').textContent = loc.name;
  document.getElementById('loc-sheet-body').innerHTML =
    '<div class="loc-no-events">Загружаем…</div>';
  document.getElementById('loc-sheet-overlay').classList.add('open');
  requestAnimationFrame(() => document.getElementById('loc-sheet').classList.add('open'));

  loadSchedule().then(events => {
    const dayIdx = getCurrentDayIdx();
    const body = document.getElementById('loc-sheet-body');
    if (!body) return;

    const locEvents = events.filter(e => e.loc === loc.id);
    if (locEvents.length === 0) {
      body.innerHTML = '<div class="loc-no-events">Событий не запланировано</div>';
      return;
    }

    // Для локаций с небольшим расписанием — показываем всё по дням
    if (FULL_SCHEDULE_LOCS.includes(loc.id)) {
      const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
      let html = '';
      for (let d = 0; d < DAY_LABELS.length; d++) {
        const dayEvs = locEvents.filter(e => e.day === d).sort((a, b) => a.time.localeCompare(b.time));
        if (!dayEvs.length) continue;
        html += `<div style="font-size:12px;font-weight:700;color:var(--tg-theme-hint-color,#888);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 4px;">${DAY_LABELS[d]}</div>`;
        dayEvs.forEach(ev => {
          const isNow = d === dayIdx && timeToMin(ev.time) <= nowMin &&
            (() => { const idx = dayEvs.indexOf(ev); return idx === dayEvs.length - 1 || timeToMin(dayEvs[idx + 1].time) > nowMin; })();
          html += `<div class="loc-event-block" style="${isNow ? 'border-left:3px solid #e74c3c;padding-left:9px;' : ''}">
            ${isNow ? '<div class="loc-event-label now">🔴 Сейчас</div>' : ''}
            <div class="loc-event-time">${ev.time}</div>
            <div class="loc-event-title">${ev.title}</div>
            ${ev.master ? `<div class="loc-event-master">${ev.master}</div>` : ''}
          </div>`;
        });
      }
      body.innerHTML = html;
      return;
    }

    // Для остальных локаций — текущее и следующее
    let dayEvents = locEvents.filter(e => e.day === dayIdx);

    if (dayIdx === -1 || dayEvents.length === 0) {
      // Вне фестиваля или нет событий — показываем ближайшие события
      const minDay = Math.min(...locEvents.map(e => e.day));
      dayEvents = locEvents.filter(e => e.day === minDay).sort((a, b) => a.time.localeCompare(b.time));
      body.innerHTML = dayEvents.slice(0, 3).map(ev =>
        `<div class="loc-event-block">
          <div class="loc-event-time">${ev.time}</div>
          <div class="loc-event-title">${ev.title}</div>
          ${ev.master ? `<div class="loc-event-master">${ev.master}</div>` : ''}
        </div>`
      ).join('');
      return;
    }

    // Во время фестиваля — ищем текущее и следующее
    const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
    dayEvents.sort((a, b) => a.time.localeCompare(b.time));

    let current = null, next = null;
    for (let i = 0; i < dayEvents.length; i++) {
      const ev = dayEvents[i];
      const evMin = timeToMin(ev.time);
      const nextMin = dayEvents[i + 1] ? timeToMin(dayEvents[i + 1].time) : 24 * 60;
      if (evMin <= nowMin && nowMin < nextMin) { current = ev; next = dayEvents[i + 1] || null; break; }
      if (evMin > nowMin && !next) { next = ev; }
    }

    let html = '';
    if (current) {
      html += `<div class="loc-event-block">
        <div class="loc-event-label now">🔴 Сейчас</div>
        <div class="loc-event-time">${current.time}</div>
        <div class="loc-event-title">${current.title}</div>
        ${current.master ? `<div class="loc-event-master">${current.master}</div>` : ''}
      </div>`;
    }
    if (next) {
      html += `<div class="loc-event-block">
        <div class="loc-event-label next">⏭ Следующее</div>
        <div class="loc-event-time">${next.time}</div>
        <div class="loc-event-title">${next.title}</div>
        ${next.master ? `<div class="loc-event-master">${next.master}</div>` : ''}
      </div>`;
    }
    if (!current && !next) {
      html = '<div class="loc-no-events">На сегодня события завершены</div>';
    }
    body.innerHTML = html;
  });
}

function closeLocSheet() {
  const sheet = document.getElementById('loc-sheet');
  sheet.style.transform = '';
  sheet.style.transition = '';
  sheet.classList.remove('open');
  document.getElementById('loc-sheet-overlay').classList.remove('open');
}

(function () {
  const sheet = document.getElementById('loc-sheet');
  let startY = 0, curY = 0, dragging = false;

  sheet.addEventListener('touchstart', function (e) {
    const body = document.getElementById('loc-sheet-body');
    if (body.scrollTop > 0) return;
    startY = e.touches[0].clientY;
    curY = 0;
    dragging = true;
    sheet.style.transition = 'none';
  }, { passive: true });

  sheet.addEventListener('touchmove', function (e) {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) return;
    curY = dy;
    sheet.style.transform = `translateY(${dy}px)`;
  }, { passive: true });

  sheet.addEventListener('touchend', function () {
    if (!dragging) return;
    dragging = false;
    if (curY > 80) {
      sheet.style.transition = 'transform 0.25s ease-in';
      sheet.style.transform = 'translateY(100%)';
      document.getElementById('loc-sheet-overlay').classList.remove('open');
      setTimeout(() => {
        sheet.classList.remove('open');
        sheet.style.transform = '';
        sheet.style.transition = '';
      }, 250);
    } else {
      sheet.style.transition = 'transform 0.28s cubic-bezier(0.4,0,0.2,1)';
      sheet.style.transform = 'translateY(0)';
      setTimeout(() => {
        sheet.style.transform = '';
        sheet.style.transition = '';
      }, 280);
    }
    curY = 0;
  });
})();

function openFullSchedule() {
  if (_currentLocId) window.location.href = `schedule.html?loc=${_currentLocId}`;
}

// Первичная отрисовка — после того как объявлены dot/ring/lastLat
fitView();

// Возврат к общему виду, когда карту закрыли и открыли снова.
// Telegram на Android не перезагружает мини-апп, а показывает в том же
// состоянии — поэтому сбрасываем вид сами при возврате видимости.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') fitView();
});
if (tg && tg.onEvent) {
  try { tg.onEvent('activated', fitView); } catch (e) {}
}
