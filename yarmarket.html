<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ярмарка — Солнечный круг</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --gold:    #c8922a;
      --gold-lt: #e8c870;
      --forest:  #1e3320;
      --cream:   #fdf6ec;
      --text:    #2a1f10;
      --muted:   #7a6a55;
      --border:  #e0cfa8;
      --sel-bg:  #fff8e8;
      --radius:  12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: var(--forest);
      color: var(--gold-lt);
      text-align: center;
      padding: 16px 16px 14px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
    .header .sub { font-size: 12px; color: #a0b89a; margin-top: 3px; }

    /* Product grid */
    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 14px;
      padding-bottom: 30px;
    }

    .product-card {
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .product-img-wrap {
      position: relative;
      padding-top: 100%;
      cursor: pointer;
      overflow: hidden;
      background: #f5f0e8;
    }
    .product-img-wrap img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.2s;
    }
    .product-img-wrap:active img { transform: scale(0.97); }
    .product-img-wrap .img-placeholder {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 44px;
      opacity: 0.3;
    }

    .product-info {
      padding: 10px 10px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .product-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
      margin-bottom: 4px;
      flex: 1;
    }
    .product-price {
      font-size: 16px;
      font-weight: 800;
      color: var(--gold);
      margin-bottom: 8px;
    }
    .btn-order {
      background: linear-gradient(135deg, var(--forest), #2d5233);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: transform 0.1s;
    }
    .btn-order:active { transform: scale(0.97); }

    /* Fullscreen product modal */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
    }
    .modal.hidden { display: none; }

    #modal-product {
      background: rgba(0,0,0,0.93);
      align-items: center;
      overflow-y: auto;
    }
    .modal-close {
      position: fixed;
      top: 14px; right: 14px;
      background: rgba(255,255,255,0.15);
      color: white;
      border: none;
      border-radius: 50%;
      width: 38px; height: 38px;
      font-size: 18px;
      cursor: pointer;
      z-index: 101;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-img-container {
      width: 100%;
      max-width: 480px;
      padding-top: 20px;
    }
    .modal-img-container img { width: 100%; display: block; }
    .modal-img-placeholder {
      width: 100%;
      aspect-ratio: 1/1;
      display: flex; align-items: center; justify-content: center;
      font-size: 80px; opacity: 0.3;
    }
    .modal-info {
      width: 100%;
      max-width: 480px;
      padding: 16px 20px 32px;
    }
    .modal-name { font-size: 18px; font-weight: 700; color: white; margin-bottom: 6px; }
    .modal-price { font-size: 24px; font-weight: 800; color: var(--gold-lt); margin-bottom: 18px; }
    .modal-btn-order {
      background: linear-gradient(135deg, #FF8C00, #E65000);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 15px 24px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 3px 10px rgba(230,80,0,0.35);
    }
    .modal-btn-order:active { transform: scale(0.98); }

    /* Order form modal */
    #modal-order {
      background: var(--cream);
      align-items: stretch;
      overflow-y: auto;
    }
    .order-header {
      background: var(--forest);
      color: var(--gold-lt);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .order-header-btn {
      background: none;
      border: none;
      color: var(--gold-lt);
      font-size: 22px;
      cursor: pointer;
      padding: 2px 6px;
      line-height: 1;
    }
    .order-header-title { font-size: 16px; font-weight: 700; }

    .order-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 32px;
    }

    .order-product-preview {
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
    }
    .order-product-img {
      width: 60px; height: 60px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .order-product-img-placeholder {
      width: 60px; height: 60px;
      border-radius: 8px;
      background: #f5f0e8;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
    }
    .order-product-name { font-size: 14px; font-weight: 600; }
    .order-product-price { font-size: 16px; font-weight: 800; color: var(--gold); margin-top: 3px; }

    .form-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 8px;
      display: block;
    }

    .size-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .size-btn {
      padding: 8px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: white;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }
    .size-btn.selected {
      border-color: var(--gold);
      background: var(--sel-bg);
      color: var(--gold);
    }

    .qty-control { display: flex; align-items: center; gap: 16px; }
    .qty-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: white;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      color: var(--gold);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .qty-btn.minus { border-color: var(--border); color: var(--muted); }
    .qty-display { font-size: 20px; font-weight: 700; min-width: 24px; text-align: center; }

    .inp-field {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 16px;
      color: var(--text);
      background: white;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }
    .inp-field:focus { border-color: var(--gold); }
    textarea.inp-field { min-height: 80px; resize: none; }

    .btn-submit {
      background: linear-gradient(135deg, #22C55E, #15803D);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 3px 10px rgba(21,128,61,0.35);
      transition: transform 0.1s;
    }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { background: #ccc; box-shadow: none; cursor: default; }

    /* Success page */
    #page-done {
      position: fixed;
      inset: 0;
      background: var(--cream);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
    }
    #page-done.hidden { display: none; }
    .done-icon { font-size: 64px; margin-bottom: 16px; }
    .done-title { font-size: 22px; font-weight: 700; color: var(--forest); margin-bottom: 12px; }
    .done-text { font-size: 15px; color: var(--muted); line-height: 1.7; }

    /* Empty state */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 56px; margin-bottom: 16px; }
    .empty-state p { font-size: 15px; line-height: 1.6; }
  </style>
</head>
<body>

<!-- КАТАЛОГ -->
<div id="page-catalog">
  <div class="header">
    <h1>🛍 Ярмарка</h1>
    <div class="sub">Предзаказ товаров к фестивалю</div>
  </div>
  <div class="product-grid" id="product-grid"></div>
</div>

<!-- МОДАЛКА: увеличенное фото -->
<div id="modal-product" class="modal hidden">
  <button class="modal-close" onclick="closeProductModal()">✕</button>
  <div class="modal-img-container" id="modal-img-container"></div>
  <div class="modal-info">
    <div class="modal-name" id="modal-name"></div>
    <div class="modal-price" id="modal-price"></div>
    <div id="modal-desc" style="font-size:14px;color:rgba(255,255,255,0.8);margin-bottom:14px;line-height:1.5;"></div>
    <button class="modal-btn-order" onclick="openOrderForm()">🛒 Заказать</button>
  </div>
</div>

<!-- МОДАЛКА: форма заказа -->
<div id="modal-order" class="modal hidden">
  <div class="order-header">
    <button class="order-header-btn" onclick="closeOrderForm()">◀</button>
    <div class="order-header-title">Оформить предзаказ</div>
  </div>
  <div class="order-body">

    <div class="order-product-preview">
      <div id="form-img-wrap"></div>
      <div>
        <div class="order-product-name" id="form-product-name"></div>
        <div class="order-product-price" id="form-product-price"></div>
      </div>
    </div>

    <div id="size-section">
      <label class="form-label">Размер</label>
      <div class="size-buttons" id="size-buttons"></div>
    </div>

    <div>
      <label class="form-label">Количество</label>
      <div class="qty-control">
        <button class="qty-btn minus" id="btn-minus" onclick="changeQty(-1)">−</button>
        <span class="qty-display" id="qty-display">1</span>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
    </div>

    <div>
      <label class="form-label">Ваше имя</label>
      <input class="inp-field" id="order-name" type="text" placeholder="Имя и фамилия" oninput="checkForm()">
    </div>

    <div>
      <label class="form-label">Телефон</label>
      <input class="inp-field" id="order-phone" type="tel" placeholder="+375291234567" oninput="checkForm()">
    </div>

    <div>
      <label class="form-label">Комментарий <span style="font-weight:400;font-size:12px;">(необязательно)</span></label>
      <textarea class="inp-field" id="order-comment" placeholder="Любые пожелания или вопросы"></textarea>
    </div>

    <button class="btn-submit" id="submit-btn" onclick="submitOrder()" disabled>✅ Оформить предзаказ</button>

    <div style="font-size:12px;color:var(--muted);text-align:center;line-height:1.6;">
      После оформления организаторы свяжутся с вами в Telegram для подтверждения и оплаты
    </div>
  </div>
</div>

<!-- ЭКРАН УСПЕХА -->
<div id="page-done" class="hidden">
  <div class="done-icon">🎉</div>
  <div class="done-title">Предзаказ оформлен!</div>
  <div class="done-text">
    Мы свяжемся с вами в Telegram для подтверждения и оплаты.<br><br>
    Спасибо, что выбрали ярмарку «Солнечного круга»!
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const API_URL = 'https://solnechny-krug-bot-production.up.railway.app/api/preorder';

let currentProduct = null;
let selectedSize = null;
let qty = 1;

// ── Рендер каталога ────────────────────────────────────────────

function renderGrid() {
  const grid = document.getElementById('product-grid');
  const products = (window.YARMARKET_CONFIG || {}).products || [];

  if (!products.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="icon">🌸</div>
        <p>Товары ярмарки скоро появятся здесь.<br>Следите за объявлениями в канале!</p>
      </div>`;
    return;
  }

  grid.innerHTML = products.map(p => `
    <div class="product-card">
      <div class="product-img-wrap" onclick="openProductModal('${p.id}')">
        ${p.image
          ? `<img src="${p.image}" alt="${p.name}" onerror="this.style.display='none';this.nextSibling.style.display='block'"><div class="img-placeholder" style="display:none">🛍</div>`
          : `<div class="img-placeholder">🛍</div>`
        }
      </div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <button class="btn-order" onclick="event.stopPropagation();openOrderFormFor('${p.id}')">Заказать</button>
      </div>
    </div>
  `).join('');
}

// ── Модалка: фото ──────────────────────────────────────────────

function openProductModal(productId) {
  const products = (window.YARMARKET_CONFIG || {}).products || [];
  currentProduct = products.find(p => p.id === productId);
  if (!currentProduct) return;

  const container = document.getElementById('modal-img-container');
  if (currentProduct.image) {
    container.innerHTML = `<img src="${currentProduct.image}" alt="${currentProduct.name}" onerror="this.parentElement.innerHTML='<div class=modal-img-placeholder>🛍</div>'">`;
  } else {
    container.innerHTML = `<div class="modal-img-placeholder">🛍</div>`;
  }

  document.getElementById('modal-name').textContent = currentProduct.name;
  document.getElementById('modal-price').textContent = '';
  document.getElementById('modal-desc').textContent = currentProduct.description || '';

  document.getElementById('modal-product').classList.remove('hidden');
  setupBack(closeProductModal);
}

function closeProductModal() {
  document.getElementById('modal-product').classList.add('hidden');
  hideBack();
  currentProduct = null;
}

// ── Модалка: форма ─────────────────────────────────────────────

function openOrderFormFor(productId) {
  const products = (window.YARMARKET_CONFIG || {}).products || [];
  currentProduct = products.find(p => p.id === productId);
  if (!currentProduct) return;
  openOrderForm();
}

function openOrderForm() {
  if (!currentProduct) return;

  document.getElementById('modal-product').classList.add('hidden');

  // Сброс
  qty = 1;
  selectedSize = null;
  document.getElementById('qty-display').textContent = '1';
  document.getElementById('btn-minus').style.opacity = '0.4';
  document.getElementById('order-name').value = '';
  document.getElementById('order-phone').value = '';
  document.getElementById('order-comment').value = '';
  document.getElementById('submit-btn').disabled = true;

  // Товар
  document.getElementById('form-product-name').textContent = currentProduct.name;
  document.getElementById('form-product-price').textContent = '';

  const imgWrap = document.getElementById('form-img-wrap');
  if (currentProduct.image) {
    imgWrap.innerHTML = `<img class="order-product-img" src="${currentProduct.image}" alt="" onerror="this.outerHTML='<div class=order-product-img-placeholder>🛍</div>'">`;
  } else {
    imgWrap.innerHTML = `<div class="order-product-img-placeholder">🛍</div>`;
  }

  // Размеры
  const sizes = currentProduct.sizes || [];
  const sizeSection = document.getElementById('size-section');
  if (sizes.length) {
    sizeSection.style.display = 'block';
    document.getElementById('size-buttons').innerHTML = sizes.map(s =>
      `<button class="size-btn" onclick="selectSize('${s}', this)">${s}</button>`
    ).join('');
  } else {
    sizeSection.style.display = 'none';
    selectedSize = '';
  }

  // Автозаполнение имени из Telegram
  const tgUser = tg?.initDataUnsafe?.user;
  if (tgUser) {
    const fullName = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ');
    if (fullName) {
      document.getElementById('order-name').value = fullName;
    }
  }

  document.getElementById('modal-order').classList.remove('hidden');
  setupBack(closeOrderForm);
  checkForm();
}

function closeOrderForm() {
  document.getElementById('modal-order').classList.add('hidden');
  hideBack();
}

function selectSize(size, btn) {
  selectedSize = size;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  checkForm();
}

function changeQty(delta) {
  qty = Math.max(1, qty + delta);
  document.getElementById('qty-display').textContent = qty;
  document.getElementById('btn-minus').style.opacity = qty <= 1 ? '0.4' : '1';
}

function checkForm() {
  const name = document.getElementById('order-name').value.trim();
  const phone = document.getElementById('order-phone').value.trim();
  const sizes = currentProduct?.sizes || [];
  const sizeOk = !sizes.length || !!selectedSize;
  document.getElementById('submit-btn').disabled = !(name.length >= 2 && phone.length >= 5 && sizeOk);
}

// ── Отправка заказа ────────────────────────────────────────────

async function submitOrder() {
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = '⌛ Отправляем…';

  const name = document.getElementById('order-name').value.trim();
  const phone = document.getElementById('order-phone').value.trim();
  const comment = document.getElementById('order-comment').value.trim();

  const orderData = {
    productId:   currentProduct.id,
    productName: currentProduct.name,
    price:       currentProduct.price,
    size:        selectedSize || '',
    qty:         qty,
    name:        name,
    phone:       phone,
    comment:     comment,
  };

  try {
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        initData: tg?.initData || '',
        data: JSON.stringify(orderData),
      }),
    });

    const result = await resp.json();
    if (!result.ok) throw new Error(result.error || 'server error');

    document.getElementById('modal-order').classList.add('hidden');
    document.getElementById('page-catalog').style.display = 'none';
    document.getElementById('page-done').classList.remove('hidden');
    hideBack();

  } catch (e) {
    btn.disabled = false;
    btn.textContent = '✅ Оформить предзаказ';
    alert('Ошибка при отправке. Попробуйте ещё раз.');
  }
}

// ── Telegram BackButton ────────────────────────────────────────

let _backCb = null;
function setupBack(cb) {
  if (!tg) return;
  if (_backCb) tg.BackButton.offClick(_backCb);
  _backCb = cb;
  tg.BackButton.onClick(_backCb);
  tg.BackButton.show();
}
function hideBack() {
  if (!tg) return;
  if (_backCb) tg.BackButton.offClick(_backCb);
  _backCb = null;
  tg.BackButton.hide();
}

// ── Инициализация ──────────────────────────────────────────────
const YARMARKET_API = 'https://solnechny-krug-bot-production.up.railway.app/api/yarmarket/items';

async function loadAndRender() {
  try {
    const resp = await fetch(YARMARKET_API);
    if (resp.ok) {
      const data = await resp.json();
      if (data.products && data.products.length > 0) {
        // Объединяем: новые из бота + старые статичные
        const staticProducts = (window.YARMARKET_CONFIG || {}).products || [];
        window.YARMARKET_CONFIG = { products: [...staticProducts, ...data.products] };
      }
    }
  } catch (e) {
    console.error('Не удалось загрузить товары из API, используем статичный конфиг:', e);
  }
  renderGrid();
}

loadAndRender();
</script>
</body>
</html>
