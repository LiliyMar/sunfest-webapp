<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Расписание — Солнечный круг</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --forest: #1e3320;
      --gold:   #c8922a;
      --gold-lt:#e8c870;
      --cream:  #fdf6ec;
      --text:   #2a1f10;
      --muted:  #7a6a55;
      --border: #e0cfa8;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Шапка */
    .header {
      background: var(--forest);
      color: var(--gold-lt);
      text-align: center;
      padding: 14px 16px 12px;
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.4px; }
    .header .sub { font-size: 11px; color: #a0b89a; margin-top: 2px; }

    /* Дни — табы */
    .day-tabs {
      display: flex;
      background: var(--forest);
      border-bottom: 2px solid var(--gold);
      position: sticky;
      top: 56px;
      z-index: 29;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .day-tabs::-webkit-scrollbar { display: none; }
    .day-tab {
      flex: 0 0 auto;
      padding: 9px 18px;
      color: #a0b89a;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      line-height: 1.3;
      text-align: center;
    }
    .day-tab .sub { font-size: 10px; font-weight: 400; display: block; }
    .day-tab.active { color: var(--gold-lt); border-bottom-color: var(--gold); }

    /* Фильтр локаций */
    .loc-filter {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 96px;
      z-index: 28;
    }
    .loc-filter::-webkit-scrollbar { display: none; }
    .loc-chip {
      flex: 0 0 auto;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid var(--border);
      background: white;
      color: var(--muted);
      transition: all 0.15s;
      white-space: nowrap;
    }
    .loc-chip.active {
      color: white;
      border-color: transparent;
    }

    /* Список событий */
    .events-wrap {
      padding: 12px 14px;
    }

    .day-section { display: none; }
    .day-section.active { display: block; }

    .event-card {
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      border-left: 4px solid var(--border);
      transition: opacity 0.2s;
    }
    .event-card.faded { opacity: 0.25; }

    .event-time {
      flex: 0 0 44px;
      font-size: 14px;
      font-weight: 700;
      color: var(--forest);
      padding-top: 1px;
    }
    .event-body { flex: 1; min-width: 0; }
    .event-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
    }
    .event-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
      font-size: 14px;
    }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }

    /* Подсветка выбранной локации */
    .loc-anchor { scroll-margin-top: 160px; }
  </style>
</head>
<body>

<div class="header">
  <h1>📅 Расписание</h1>
  <div class="sub">Солнечный круг · 2–5 июля 2026</div>
</div>

<div class="day-tabs" id="day-tabs"></div>
<div class="loc-filter" id="loc-filter"></div>
<div class="events-wrap" id="events-wrap"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ═══════════════════════════════════════════════════════════════
// НАСТРОЙКИ — заполните свои данные
// ═══════════════════════════════════════════════════════════════

const DAYS = [
  { label: '2 июля', sub: 'чт' },
  { label: '3 июля', sub: 'пт' },
  { label: '4 июля', sub: 'сб ☀️' },
  { label: '5 июля', sub: 'вс' },
];

// Локации: id, название, эмодзи, цвет полоски
const LOCS = [
  { id: 'kolo',     name: 'Коло',             emoji: '🎭', color: '#5ab0d1' },
  { id: 'polyana',  name: 'Солнечная поляна',  emoji: '🌿', color: '#6bd58f' },
  { id: 'besedka',  name: 'Лунная беседка',   emoji: '🌙', color: '#c2a36b' },
  { id: 'steklo',   name: 'Стекляшка',        emoji: '🪟', color: '#a8b4ff' },
  { id: 'izba',     name: 'Изба',             emoji: '🏠', color: '#ff7a6a' },
  { id: 'detskaya',  name: 'Детская',           emoji: '👧', color: '#f9c74f' },
  { id: 'stolovaya', name: 'Столовая',          emoji: '🍽', color: '#e07b54' },
];

// События
// day: 0=2июля, 1=3июля, 2=4июля, 3=5июля
// loc: id из LOCS выше
// master: имя ведущего (можно оставить пустым)
const EVENTS = [
  // ──── 2 июля (чт) ────────────────────────────────────────────
  { day: 0, time: '12:00', title: 'Заезд, размещение', master: '', loc: 'kolo' },
  { day: 0, time: '17:00', title: 'Общий сбор. Открытие слёта', master: '', loc: 'kolo' },
  { day: 0, time: '18:30', title: 'Ужин', master: '', loc: 'kolo' },

  // ──── 3 июля (пт) ────────────────────────────────────────────
  { day: 1, time: '09:00', title: 'Мастер-класс (добавьте)', master: '', loc: 'polyana' },
  { day: 1, time: '13:00', title: 'Обед', master: '', loc: 'kolo' },
  { day: 1, time: '20:30', title: 'Вечерняя программа', master: '', loc: 'kolo' },

  // ──── 4 июля (сб, Купалье) ───────────────────────────────────
  { day: 2, time: '09:00', title: 'Мастер-класс (добавьте)', master: '', loc: 'polyana' },
  { day: 2, time: '13:00', title: 'Обед', master: '', loc: 'kolo' },
  { day: 2, time: '21:00', title: '🌙 Купалье — обряд у костра', master: '', loc: 'kolo' },

  // ──── 5 июля (вс) ────────────────────────────────────────────
  { day: 3, time: '09:00', title: 'Мастер-класс (добавьте)', master: '', loc: 'polyana' },
  { day: 3, time: '13:00', title: 'Обед', master: '', loc: 'kolo' },
  { day: 3, time: '15:00', title: 'Закрытие слёта', master: '', loc: 'kolo' },
  { day: 3, time: '17:00', title: 'Отъезд', master: '', loc: 'kolo' },
];

// ═══════════════════════════════════════════════════════════════
// Логика — не менять
// ═══════════════════════════════════════════════════════════════

// URL-параметр ?loc=id для открытия из карты
const urlLoc = new URLSearchParams(location.search).get('loc') || 'all';

let activeDayIdx = 0;
let activeLoc = urlLoc;

const locMap = Object.fromEntries(LOCS.map(l => [l.id, l]));

// Рендер табов дней
const dayTabsEl = document.getElementById('day-tabs');
DAYS.forEach((d, i) => {
  const el = document.createElement('div');
  el.className = 'day-tab' + (i === 0 ? ' active' : '');
  el.innerHTML = `${d.label}<span class="sub">${d.sub}</span>`;
  el.onclick = () => setDay(i);
  dayTabsEl.appendChild(el);
});

// Рендер фильтра локаций
const locFilterEl = document.getElementById('loc-filter');
const allLocs = [{ id: 'all', name: 'Все', emoji: '📋', color: '#8b7bff' }, ...LOCS];
allLocs.forEach(loc => {
  const el = document.createElement('div');
  el.className = 'loc-chip' + (loc.id === activeLoc ? ' active' : '');
  el.textContent = loc.emoji + ' ' + loc.name;
  if (loc.id === activeLoc) el.style.background = loc.color;
  el.onclick = () => setLoc(loc.id);
  locFilterEl.appendChild(el);
});

// Рендер событий
const eventsWrapEl = document.getElementById('events-wrap');
DAYS.forEach((d, di) => {
  const section = document.createElement('div');
  section.className = 'day-section' + (di === 0 ? ' active' : '');
  section.id = 'day-' + di;

  const dayEvents = EVENTS.filter(e => e.day === di);
  if (!dayEvents.length) {
    section.innerHTML = '<div class="empty"><div class="icon">📋</div><p>Расписание появится позже</p></div>';
  } else {
    dayEvents.sort((a, b) => a.time.localeCompare(b.time));
    dayEvents.forEach(ev => {
      const loc = locMap[ev.loc] || locMap['other'];
      const card = document.createElement('div');
      card.className = 'event-card';
      card.style.borderLeftColor = loc.color;
      card.dataset.loc = ev.loc;
      card.innerHTML = `
        <div class="event-time">${ev.time}</div>
        <div class="event-body">
          <div class="event-title">${ev.title}</div>
          ${ev.master ? `<div class="event-meta">${loc.emoji} ${loc.name} · ${ev.master}</div>` : `<div class="event-meta">${loc.emoji} ${loc.name}</div>`}
        </div>`;
      section.appendChild(card);
    });
  }
  eventsWrapEl.appendChild(section);
});

function setDay(idx) {
  activeDayIdx = idx;
  document.querySelectorAll('.day-tab').forEach((el, i) => el.classList.toggle('active', i === idx));
  document.querySelectorAll('.day-section').forEach((el, i) => el.classList.toggle('active', i === idx));
  applyLocFilter();
}

function setLoc(locId) {
  activeLoc = locId;
  document.querySelectorAll('.loc-chip').forEach((el, i) => {
    const loc = allLocs[i];
    el.classList.toggle('active', loc.id === locId);
    el.style.background = loc.id === locId ? loc.color : '';
  });
  applyLocFilter();
}

function applyLocFilter() {
  document.querySelectorAll('.event-card').forEach(card => {
    const match = activeLoc === 'all' || card.dataset.loc === activeLoc;
    card.classList.toggle('faded', !match);
  });
}

// Если открыто из карты (?loc=id) — показать нужную локацию
if (urlLoc !== 'all' && locMap[urlLoc]) {
  setLoc(urlLoc);
}
applyLocFilter();
</script>
</body>
</html>
