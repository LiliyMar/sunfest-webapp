<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Расписание — Солнечный круг</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --forest:  #1a3320;
      --forest2: #2d5035;
      --gold:    #c8922a;
      --gold-lt: #e8c870;
      --cream:   #fdf6ec;
      --warm:    #fef9f2;
      --text:    #2a1f10;
      --muted:   #7a6a55;
      --border:  #e0cfa8;
      --radius:  12px;
      --shadow:  0 2px 10px rgba(42,31,16,0.07);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, 'Segoe UI', Helvetica, sans-serif;
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 48px;
    }

    /* ═══ ШАПКА ═══ */
    .header {
      background: linear-gradient(160deg, #162b1a 0%, #2d5035 55%, #1e4a28 100%);
      padding: 22px 16px 32px;
      text-align: center;
      position: relative;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 24px;
      background: var(--cream);
      border-radius: 24px 24px 0 0;
    }
    .back-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--gold-lt);
      font-size: 20px;
      text-decoration: none;
      z-index: 2;
      line-height: 1;
    }
    .back-btn:active { background: rgba(255,255,255,0.25); }
    .header .sun { font-size: 38px; line-height: 1; display: block; margin-bottom: 8px; }
    .header h1 {
      color: var(--gold-lt);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .header .sub {
      color: #90b898;
      font-size: 12px;
      margin-top: 4px;
    }

    /* ═══ STICKY-БЛОК (дни + фильтр) ═══ */
    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--cream);
      padding-bottom: 2px;
    }

    /* ═══ ТАБЫ ДНЕЙ ═══ */
    .day-tabs {
      display: flex;
      padding: 10px 12px 8px;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .day-tabs::-webkit-scrollbar { display: none; }
    .day-tab {
      flex: 1;
      min-width: 68px;
      padding: 9px 6px 10px;
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
      background: white;
      border: 2px solid var(--border);
      transition: all 0.18s;
      user-select: none;
      -webkit-user-select: none;
    }
    .day-tab .d-num {
      font-size: 22px;
      font-weight: 800;
      color: var(--muted);
      line-height: 1;
    }
    .day-tab .d-month {
      font-size: 10px;
      color: var(--muted);
      margin-top: 1px;
    }
    .day-tab .d-sub {
      font-size: 10px;
      font-weight: 600;
      color: #bbb;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .day-tab.active {
      background: var(--forest);
      border-color: var(--forest);
      box-shadow: 0 4px 14px rgba(26,51,32,0.35);
    }
    .day-tab.active .d-num   { color: var(--gold-lt); }
    .day-tab.active .d-month { color: #90b898; }
    .day-tab.active .d-sub   { color: #6a9b72; }

    /* Тонкий разделитель */
    .sticky-line {
      height: 1px;
      margin: 0 14px;
      background: var(--border);
      opacity: 0.6;
    }

    /* ═══ ФИЛЬТР ЛОКАЦИЙ ═══ */
    .loc-strip {
      display: flex;
      gap: 6px;
      padding: 8px 12px 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .loc-strip::-webkit-scrollbar { display: none; }
    .loc-chip {
      flex: 0 0 auto;
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--border);
      background: white;
      color: var(--muted);
      white-space: nowrap;
      transition: all 0.15s;
    }
    .loc-chip.active { color: white; border-color: transparent; }

    /* ═══ СОБЫТИЯ ═══ */
    .events-wrap { padding: 10px 13px 20px; }
    .day-section { display: none; }
    .day-section.active { display: block; }

    /* Блок одного тайм-слота */
    .time-block { margin-bottom: 16px; }

    .time-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
    }
    .time-val {
      font-size: 14px;
      font-weight: 800;
      color: var(--forest);
      min-width: 44px;
      letter-spacing: -0.2px;
    }
    .time-dash {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, var(--border), transparent);
    }

    /* Карточка события */
    .event-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: white;
      border-radius: 11px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(224,207,168,0.6);
      border-left: 4px solid var(--border);
      padding: 10px 12px 10px 11px;
      margin-bottom: 6px;
      transition: opacity 0.2s;
    }
    .event-card.faded { opacity: 0.15; }

    /* Объявление (Общий сбор) — компактный вид */
    .event-card.announce {
      background: var(--warm);
      border: 1px solid var(--border);
      border-left: 3px solid #d4c89a;
      box-shadow: none;
      padding: 6px 12px 6px 10px;
    }

    /* Еда — чуть ярче */
    .event-card.meal {
      background: #fff9f5;
    }

    .ev-body { flex: 1; min-width: 0; }
    .ev-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.35;
    }
    .announce .ev-title {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
    }
    .ev-master {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      opacity: 0.65;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .ev-master::before { content: ''; display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: currentColor; }

    /* Бейдж локации */
    .loc-badge {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 10px;
      color: white;
      margin-top: 1px;
      white-space: nowrap;
      letter-spacing: 0.2px;
    }

    /* Пустое */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty .icon { font-size: 52px; margin-bottom: 14px; }
    .empty p { font-size: 14px; line-height: 1.5; }

    /* Загрузка */
    .loading {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 14px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══ КЛИКАБЕЛЬНЫЙ ЗАГОЛОВОК МАСТЕРА ═══ */
    .ev-title.has-master {
      color: var(--forest);
      cursor: pointer;
      display: inline-block;
    }
    .ev-title.has-master::after {
      content: ' ›';
      color: var(--gold);
      font-size: 15px;
    }
    .ev-title.has-master:active { opacity: 0.7; }

    /* ═══ МОДАЛЬНОЕ ОКНО МАСТЕРА ═══ */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      align-items: flex-end;
    }
    .modal-overlay.open { display: flex; }
    .master-modal {
      background: var(--cream);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 0 0 40px;
      position: relative;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    }
    .master-modal.open { transform: translateY(0); }
    .modal-drag-handle {
      width: 40px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 12px auto 0;
    }
    .modal-close {
      position: absolute;
      top: 12px; right: 16px;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.08);
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
    }
    .master-photo {
      width: 110px; height: 110px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      display: block;
      margin: 20px auto 0;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .master-photo-placeholder {
      width: 110px; height: 110px;
      border-radius: 50%;
      background: var(--forest2);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin: 20px auto 0;
    }
    .modal-body {
      padding: 16px 20px 0;
    }
    .modal-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .modal-event-name {
      font-size: 13px;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 14px;
    }
    .modal-desc {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .modal-tg-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      padding: 10px 16px;
      background: var(--forest);
      color: var(--gold-lt);
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>

<!-- Шапка -->
<div class="header">
  <a class="back-btn" href="#" onclick="event.preventDefault(); history.length > 1 ? history.back() : (window.Telegram?.WebApp?.close ? window.Telegram.WebApp.close() : window.location.href='map.html')" title="Назад">←</a>
  <span class="sun">🌞</span>
  <h1>Расписание</h1>
  <div class="sub">Солнечный круг · 2–5 июля 2026</div>
</div>

<!-- Дни + фильтр (sticky) -->
<div class="sticky-top">
  <div class="day-tabs" id="day-tabs"></div>
  <div class="sticky-line"></div>
  <div class="loc-strip" id="loc-strip"></div>
  <div class="sticky-line"></div>
</div>

<!-- Контент -->
<div class="events-wrap" id="events-wrap">
  <div class="loading"><div class="spinner"></div>Загружаем расписание…</div>
</div>

<!-- Модальное окно мастера -->
<div class="modal-overlay" id="modal-overlay" onclick="closeMasterModal(event)">
  <div class="master-modal" id="master-modal">
    <div class="modal-drag-handle"></div>
    <button class="modal-close" onclick="closeMasterModal()">✕</button>
    <div id="modal-photo-wrap"></div>
    <div class="modal-body">
      <div class="modal-title" id="modal-master-name"></div>
      <div class="modal-event-name" id="modal-event-name"></div>
      <div class="modal-desc" id="modal-desc"></div>
      <a id="modal-tg-link" class="modal-tg-link" target="_blank" style="display:none">✈️ Полное описание в Telegram</a>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const API_URL     = 'https://solnechny-krug-bot-production.up.railway.app/api/schedule';
const MASTERS_URL = 'https://solnechny-krug-bot-production.up.railway.app/api/masters';

let mastersMap = {}; /* имя → { photo_url, description, tg_post_url } */

const DAYS = [
  { num: '2',  month: 'июля', sub: 'чт' },
  { num: '3',  month: 'июля', sub: 'пт' },
  { num: '4',  month: 'июля', sub: 'сб ☀' },
  { num: '5',  month: 'июля', sub: 'вс' },
];

const LOCS = [
  { id: 'kolo',      name: 'Коло',            emoji: '🎭', color: '#5ab0d1' },
  { id: 'steklo',    name: 'Солнечный шатёр', emoji: '⛺', color: '#a8b4ff' },
  { id: 'besedka',   name: 'Беседка',         emoji: '🌙', color: '#c2a36b' },
  { id: 'izba',      name: 'Творческая',      emoji: '🎨', color: '#ff7a6a' },
  { id: 'veranda',   name: 'Веранда',         emoji: '🌿', color: '#8bc48a' },
  { id: 'detskaya',  name: 'Детская',         emoji: '👧', color: '#f9c74f' },
  { id: 'stolovaya', name: 'Столовая',        emoji: '🍽', color: '#e07b54' },
  { id: 'banya',     name: 'Баня',            emoji: '♨️', color: '#e8584a' },
];
const locMap = Object.fromEntries(LOCS.map(l => [l.id, l]));

const params   = new URLSearchParams(location.search);
const urlLoc   = params.get('loc') || 'all';
const urlDay   = parseInt(params.get('day') ?? '0', 10);

let activeDayIdx = (urlDay >= 0 && urlDay < DAYS.length) ? urlDay : 0;
let activeLoc    = urlLoc;

/* ── Табы дней ── */
const dayTabsEl = document.getElementById('day-tabs');
DAYS.forEach((d, i) => {
  const el = document.createElement('div');
  el.className = 'day-tab' + (i === activeDayIdx ? ' active' : '');
  el.innerHTML = `<div class="d-num">${d.num}</div><div class="d-month">${d.month}</div><div class="d-sub">${d.sub}</div>`;
  el.onclick = () => setDay(i);
  dayTabsEl.appendChild(el);
});

/* ── Фильтр локаций ── */
const locStripEl = document.getElementById('loc-strip');
const allLocs = [{ id: 'all', name: 'Все', emoji: '📋', color: '#6b8cff' }, ...LOCS];
allLocs.forEach(loc => {
  const el = document.createElement('div');
  el.className = 'loc-chip' + (loc.id === activeLoc ? ' active' : '');
  el.textContent = loc.emoji + ' ' + loc.name;
  if (loc.id === activeLoc) el.style.background = loc.color;
  el.onclick = () => setLoc(loc.id);
  locStripEl.appendChild(el);
});

/* ── Рендер ── */
const eventsWrapEl = document.getElementById('events-wrap');

function isAnnounce(title) {
  const t = title.toLowerCase();
  return t.startsWith('общий сбор') || t.startsWith('объявление');
}
function isMeal(title) {
  const t = title.toLowerCase().trim().replace(/[.,]/g, '');
  return t === 'ужин' || t === 'завтрак' || t === 'обед';
}

function renderEvents(events) {
  eventsWrapEl.innerHTML = '';
  DAYS.forEach((_, di) => {
    const section = document.createElement('div');
    section.className = 'day-section' + (di === activeDayIdx ? ' active' : '');
    section.id = 'day-' + di;

    const dayEvs = events
      .filter(e => e.day === di)
      .sort((a, b) => a.time.localeCompare(b.time));

    if (!dayEvs.length) {
      section.innerHTML = `<div class="empty"><div class="icon">📋</div><p>Расписание<br>появится позже</p></div>`;
    } else {
      /* Группируем по времени */
      const byTime = new Map();
      for (const ev of dayEvs) {
        if (!byTime.has(ev.time)) byTime.set(ev.time, []);
        byTime.get(ev.time).push(ev);
      }

      for (const [time, evs] of byTime) {
        const block = document.createElement('div');
        block.className = 'time-block';

        /* Метка времени */
        const tr = document.createElement('div');
        tr.className = 'time-row';
        tr.innerHTML = `<div class="time-val">${time}</div><div class="time-dash"></div>`;
        block.appendChild(tr);

        /* Карточки — сортируем по порядку локаций в LOCS */
        const locOrder = Object.fromEntries(LOCS.map((l, i) => [l.id, i]));
        evs.sort((a, b) => (locOrder[a.loc] ?? 99) - (locOrder[b.loc] ?? 99));
        for (const ev of evs) {
          const loc    = locMap[ev.loc] || { emoji: '📌', name: ev.loc, color: '#aaa' };
          const card   = document.createElement('div');
          const ann    = isAnnounce(ev.title);
          const meal   = isMeal(ev.title);
          card.className = 'event-card' + (ann ? ' announce' : meal ? ' meal' : '');
          card.style.borderLeftColor = loc.color;
          card.dataset.loc = ev.loc;

          const badge  = ann ? '' : `<div class="loc-badge" style="background:${loc.color}">${loc.emoji}&nbsp;${loc.name}</div>`;
          const master = ev.master ? `<div class="ev-master">${ev.master}</div>` : '';

          const hasMaster = !ann && ev.master && mastersMap[ev.master];
          const esc = s => (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
          const titleHtml = hasMaster
            ? `<span class="ev-title has-master" data-master="${esc(ev.master)}" data-title="${esc(ev.title)}">${ev.title}</span>`
            : `<div class="ev-title">${ev.title}</div>`;

          card.innerHTML = `<div class="ev-body">${titleHtml}${master}</div>${badge}`;
          block.appendChild(card);
        }

        section.appendChild(block);
      }
    }
    eventsWrapEl.appendChild(section);
  });

  applyLocFilter();
}

function setDay(idx) {
  activeDayIdx = idx;
  document.querySelectorAll('.day-tab').forEach((el, i) => el.classList.toggle('active', i === idx));
  document.querySelectorAll('.day-section').forEach((el, i) => el.classList.toggle('active', i === idx));
  window.scrollTo({ top: 0, behavior: 'smooth' });
  applyLocFilter();
}

function setLoc(locId) {
  activeLoc = locId;
  document.querySelectorAll('.loc-chip').forEach((el, i) => {
    const loc = allLocs[i];
    el.classList.toggle('active', loc.id === locId);
    el.style.background = loc.id === locId ? loc.color : '';
  });
  applyLocFilter();
}

function applyLocFilter() {
  document.querySelectorAll('.event-card').forEach(card => {
    const match = activeLoc === 'all' || card.dataset.loc === activeLoc;
    card.classList.toggle('faded', !match);
  });
}

/* ── Модальное окно ── */
function showMasterModal(masterName, eventTitle) {
  const m = mastersMap[masterName];
  if (!m) return;

  const photoWrap = document.getElementById('modal-photo-wrap');
  if (m.photo_url) {
    photoWrap.innerHTML = `<img class="master-photo" src="${m.photo_url}" alt="${masterName}" onerror="this.style.display='none'">`;
  } else {
    photoWrap.innerHTML = `<div class="master-photo-placeholder">🧘</div>`;
  }

  document.getElementById('modal-master-name').textContent = masterName;
  document.getElementById('modal-event-name').textContent  = eventTitle;
  document.getElementById('modal-desc').textContent        = m.description || '';

  const tgLink = document.getElementById('modal-tg-link');
  if (m.tg_post_url) {
    tgLink.href = m.tg_post_url;
    tgLink.style.display = 'inline-flex';
  } else {
    tgLink.style.display = 'none';
  }

  const overlay = document.getElementById('modal-overlay');
  const modal   = document.getElementById('master-modal');
  overlay.classList.add('open');
  requestAnimationFrame(() => modal.classList.add('open'));
  document.body.style.overflow = 'hidden';
}

function doCloseMasterModal() {
  const overlay = document.getElementById('modal-overlay');
  const modal   = document.getElementById('master-modal');
  modal.style.transform = '';
  modal.style.transition = '';
  modal.classList.remove('open');
  setTimeout(() => {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  }, 280);
}

function closeMasterModal(e) {
  const overlay = document.getElementById('modal-overlay');
  if (e && e.target !== overlay && !e.target.classList.contains('modal-close')) return;
  doCloseMasterModal();
}

(function () {
  const modal = document.getElementById('master-modal');
  let startY = 0, curY = 0, dragging = false;

  modal.addEventListener('touchstart', function (e) {
    if (modal.scrollTop > 0) return;
    startY = e.touches[0].clientY;
    curY = 0;
    dragging = true;
    modal.style.transition = 'none';
  }, { passive: true });

  modal.addEventListener('touchmove', function (e) {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) return;
    e.preventDefault();
    curY = dy;
    modal.style.transform = `translateY(${dy}px)`;
  }, { passive: false });

  modal.addEventListener('touchend', function () {
    if (!dragging) return;
    dragging = false;
    if (curY > 80) {
      modal.style.transition = 'transform 0.25s ease-in';
      modal.style.transform = 'translateY(100%)';
      document.getElementById('modal-overlay').classList.remove('open');
      document.body.style.overflow = '';
      setTimeout(() => {
        modal.classList.remove('open');
        modal.style.transform = '';
        modal.style.transition = '';
      }, 250);
    } else {
      modal.style.transition = 'transform 0.28s cubic-bezier(0.4,0,0.2,1)';
      modal.style.transform = 'translateY(0)';
      setTimeout(() => {
        modal.style.transform = '';
        modal.style.transition = '';
      }, 280);
    }
    curY = 0;
  });
})();

document.addEventListener('click', function(e) {
  const el = e.target.closest('.has-master');
  if (!el) return;
  showMasterModal(el.dataset.master, el.dataset.title);
});

/* ── Загрузка из API ── */
Promise.all([
  fetch(API_URL).then(r => r.json()).catch(() => ({ events: [] })),
  fetch(MASTERS_URL).then(r => r.json()).catch(() => ({ masters: [] })),
]).then(([schedData, mastersData]) => {
  if (mastersData.masters) {
    mastersData.masters.forEach(m => { mastersMap[m.name] = m; });
  }
  if (schedData.events && schedData.events.length > 0) {
    renderEvents(schedData.events);
    if (activeDayIdx !== 0) setDay(activeDayIdx);
    if (urlLoc !== 'all' && locMap[urlLoc]) setLoc(urlLoc);
  } else {
    eventsWrapEl.innerHTML = `<div class="empty"><div class="icon">📋</div><p>Расписание<br>появится позже</p></div>`;
  }
}).catch(() => {
  eventsWrapEl.innerHTML = `<div class="empty"><div class="icon">🌿</div><p>Нет соединения.<br>Попробуйте позже.</p></div>`;
});
</script>
</body>
</html>
